plugins {
    id 'com.android.application'
}
android {
    namespace 'com.pankajneetu.weddingmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pankajneetu.weddingmanager'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
